        redis:
          type: string
          enum:
          - up
          - down
      required:
      - status
      - postgres
      - redis
  responses:
    BadRequest:
      description: 'Invalid request or malformed app version. Codes: INVALID_INPUT, PASSWORD_POLICY, APP_VERSION_INVALID.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Missing/invalid session, invalid credentials, or reused refresh token. Codes: UNAUTHORIZED,
        INVALID_CREDENTIALS, REFRESH_TOKEN_REUSED.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Insufficient role, different ride owner, or failed CSRF checks. Codes: FORBIDDEN,
        CSRF_INVALID.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Resource missing, no active ride/application, or unknown API version. Codes: NOT_FOUND,
        API_VERSION_NOT_FOUND.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: 'Unsupported HTTP method; includes Allow. Codes: METHOD_NOT_ALLOWED.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Allow:
          schema:
            type: string
          description: Allowed methods for this path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'The operation conflicts with current account, application, or ride state. Codes: EMAIL_TAKEN,
        DRIVER_ALREADY_VERIFIED, APPLICATION_PENDING, APPLICATION_ALREADY_REVIEWED, APPLICANT_INACTIVE,
        DRIVER_HAS_ACTIVE_RIDE, RIDE_NOT_ACTIVE.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: 'App version is below the configured supported minimum. Codes: APP_VERSION_UNSUPPORTED.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'IP/route-group request limit exceeded. Codes: RATE_LIMITED.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 'Unexpected server or PostgreSQL failure. Cache outages fall back to PostgreSQL and
        are not an error response. Codes: INTERNAL_ERROR.'
      headers:
        X-API-Version:
          $ref: '#/components/headers/X-API-Version'
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
