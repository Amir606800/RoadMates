openapi: 3.0.3
info:
  title: RoadMates API v1
  version: 0.1.0
  description: 'Versioned endpoints use /api/v1. Operational endpoints remain unversioned.

    All responses carry X-API-Version: 1 and X-Request-ID. Every JSON error is

    {code, message, request_id}. JSON responses use Cache-Control: no-store;

    server-side caching is separate from browser caching. A valid incoming request

    ID is preserved (1–128 ASCII letters, digits, . _ : -); otherwise one is generated.

    All GET endpoints also accept HEAD. Unsupported methods return 405 and Allow.

    Unknown /api/vN routes return 404 API_VERSION_NOT_FOUND.


    Optional X-App-Version must be a full semantic version. Invalid values return

    400 APP_VERSION_INVALID; versions below MIN_SUPPORTED_APP_VERSION return

    426 APP_VERSION_UNSUPPORTED. Missing headers are allowed and logged. Health

    and readiness are exempt. Clients send X-Client: web. Configured deprecated v1

    responses include Deprecation and Sunset headers.


    JSON request bodies have a 16 KiB limit. Unknown fields, invalid media types,

    extra JSON documents, or invalid input return 400. Strings are trimmed at

    the handler boundary. Error messages never echo credentials or PINs.


    Rate limits are per IP and route group in fixed one-minute windows: register 5,

    login 10, refresh 60, driver applications 10. Redis shares counters between

    instances; outages use a bounded per-process fallback. 429 includes Retry-After.


    JWT access tokens remain in React memory. The opaque refresh token is only in

    the HttpOnly SameSite=Lax roadmates_refresh cookie (Path=/api/v1/auth; Secure

    under HTTPS). Rotation is mandatory; reuse revokes the entire token family.

    Refresh and logout require the exact configured Origin and

    X-Requested-With: roadmates. All application pages use a single browser origin.

    '
servers:
- url: /
  description: Same origin as the frontend nginx proxy
tags:
- name: Operations
- name: Authentication
- name: Driver verification
- name: Administration
- name: Districts
- name: Rides
paths:
  /healthz:
    get:
      tags:
      - Operations
      operationId: health
      summary: Liveness independent of dependencies
      description: Liveness independent of dependencies
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      security: []
      responses:
        '200':
          description: Process is alive.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags:
      - Operations
      operationId: ready
      summary: Readiness of PostgreSQL and Redis
      description: 200 ok when both dependencies are up; 200 degraded if only Redis is down. PostgreSQL
        down returns 503 not_ready. Checks have a two-second deadline.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      security: []
      responses:
        '200':
          description: Readiness of PostgreSQL and Redis.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: PostgreSQL is unavailable.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/version:
    get:
      tags:
      - Operations
      operationId: appVersion
      summary: Current app/build and compatibility metadata
      description: Current app/build and compatibility metadata
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security: []
      responses:
        '200':
          description: Current app/build and compatibility metadata.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/:
    get:
      tags:
      - Operations
      operationId: v1Index
      summary: API v1 index
      description: API v1 index
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security: []
      responses:
        '200':
          description: API generation.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  api_version:
                    type: string
                    enum:
                    - v1
                required:
                - api_version
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1:
    get:
      tags:
      - Operations
      operationId: v1Redirect
      summary: Redirect to /api/v1/
      description: Redirect to /api/v1/
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security: []
      responses:
        '308':
          description: Redirect to /api/v1/.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              schema:
                type: string
                enum:
                - /api/v1/
              description: Canonical API index path.
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      operationId: register
      summary: Register a client account
      description: Email is lowercased. New users automatically receive client. Duplicate email returns
        409 EMAIL_TAKEN. Sets a refresh cookie and returns an in-memory access token.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security: []
      responses:
        '201':
          description: Register a client account.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Sign in
      description: Unknown email and wrong password share INVALID_CREDENTIALS and the same bcrypt failure
        path. Sets a new refresh-token family cookie.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security: []
      responses:
        '200':
          description: Sign in.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refresh
      summary: Rotate the refresh session
      description: Consumes the refresh cookie, revokes it and issues its replacement in one transaction.
        Reusing a revoked token revokes its entire family and returns 401 REFRESH_TOKEN_REUSED. Returns
        current roles, including driver after approval.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Rotate the refresh session.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Revoke the current refresh family
      description: Revokes the current refresh family and clears its cookie. Missing/unknown cookie still
        returns 204. Existing stateless access JWTs remain valid until expiry; the app clears its memory
        token.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      security:
      - refreshCookie: []
      - {}
      responses:
        '204':
          description: Revoke the current refresh family.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: me
      summary: Current active user and roles
      description: Current active user and roles
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current active user and roles.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - client
  /api/v1/driver-applications:
    post:
      tags:
      - Driver verification
      operationId: applyToDrive
      summary: Submit a driver application
      description: One pending application per user. Already verified drivers return DRIVER_ALREADY_VERIFIED,
        including with an older client-only JWT. PIN is encrypted before persistence and omitted from
        this response.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Submit a driver application.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverApplicationRequest'
  /api/v1/driver-applications/me:
    get:
      tags:
      - Driver verification
      operationId: myDriverApplication
      summary: Latest driver application
      description: 404 NOT_FOUND when no application exists. Public applicant DTO never includes the PIN
        or ciphertext.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Latest driver application.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - client
  /api/v1/admin/driver-applications:
    get:
      tags:
      - Administration
      operationId: listDriverApplications
      summary: List driver applications
      description: Newest applications first. Lists never include decrypted PINs or ciphertext.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
          default: pending
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List driver applications.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - admin
  /api/v1/admin/driver-applications/{id}:
    get:
      tags:
      - Administration
      operationId: driverApplicationDetail
      summary: Review an application and decrypted PIN
      description: Review an application and decrypted PIN
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/ID'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Review an application and decrypted PIN.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApplicationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - admin
    patch:
      tags:
      - Administration
      operationId: reviewDriverApplication
      summary: Approve or reject an application
      description: Approval inserts driver while retaining client in the same transaction as the review.
        Competing reviews return APPLICATION_ALREADY_REVIEWED. Approval of an inactive user returns APPLICANT_INACTIVE.
        Applicant sees the driver role on next auth refresh.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/ID'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Approve or reject an application.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApplicationRequest'
  /api/v1/districts:
    get:
      tags:
      - Districts
      operationId: listDistricts
      summary: Search active districts
      description: Public; ordered by sort_order then name_az. Fold ə→e, ı/İ→i, ö→o, ü→u, ç→c, ş→s, ğ→g,
        and lowercase (including uppercase equivalents). Permit districts stay selectable. Cached server-side
        for 24 hours.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 80
          default: ''
        description: Trimmed, case-insensitive substring of the folded Azerbaijani search key. samaxi
          finds Şamaxı. Percent and underscore are literal.
      security: []
      responses:
        '200':
          description: Search active districts.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rides:
    get:
      tags:
      - Rides
      operationId: searchRides
      summary: Search available future rides
      description: Public. Optional filters; identical nonempty stops are invalid. Only published rides
        with seats_available > 0, future departures, active users/districts. Ordered by departure_at then
        id. Search ID sets are cached 30–60 seconds with jitter; names/notes and current availability
        are read from PostgreSQL. Publish/cancel/complete bump the search namespace. No individual seat
        reservations exist.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - in: query
        name: from_district_id
        schema:
          type: integer
          minimum: 1
          maximum: 32767
      - in: query
        name: to_district_id
        schema:
          type: integer
          minimum: 1
          maximum: 32767
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Azerbaijan calendar day (Asia/Baku, UTC+04:00); optional. Four-digit year 0001–9999.
      security: []
      responses:
        '200':
          description: Search available future rides.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Rides
      operationId: publishRide
      summary: Publish a ride
      description: One active ride (published or in_progress) per driver. Service precheck and PostgreSQL
        partial unique index both return 409 DRIVER_HAS_ACTIVE_RIDE. seats_available initially equals
        seats_total. Names/district metadata are included in the response.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Publish a ride.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRideRequest'
  /api/v1/rides/me/active:
    get:
      tags:
      - Rides
      operationId: myActiveRide
      summary: Current active ride
      description: Published or in_progress ride regardless of whether departure has passed. 404 NOT_FOUND
        means no active ride and publishing is allowed.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
