  /api/v1/rides/{id}/cancel:
    patch:
      tags:
      - Rides
      operationId: cancelRide
      summary: Cancel the owner’s active ride
      description: Only the owner driver can act. Atomically changes published/in_progress to cancelled,
        allowing a new publish. An already terminal ride returns 409 RIDE_NOT_ACTIVE. Search namespace
        is invalidated after commit. No request body.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/ID'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cancel the owner’s active ride.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - driver
  /api/v1/rides/{id}/complete:
    patch:
      tags:
      - Rides
      operationId: completeRide
      summary: Complete the owner’s active ride
      description: Only the owner driver can act. Atomically changes published/in_progress to completed,
        allowing a new publish. An already terminal ride returns 409 RIDE_NOT_ACTIVE. Search namespace
        is invalidated after commit. No request body.
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/Client'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/ID'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Complete the owner’s active ride.
          headers:
            X-API-Version:
              $ref: '#/components/headers/X-API-Version'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      x-required-roles:
      - driver
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access JWT; sub, roles, iat, exp, jti. Roles are checked per operation.
    refreshCookie:
      type: apiKey
      in: cookie
      name: roadmates_refresh
      description: Opaque 32-byte token, base64url-encoded (43 characters). Sent only as an HttpOnly cookie.
  headers:
    X-API-Version:
      schema:
        type: string
        enum:
        - '1'
      description: Backend API generation.
    X-Request-ID:
      schema:
        type: string
      description: Request correlation ID; also present in JSON errors.
    Cache-Control:
      schema:
        type: string
        enum:
        - no-store
      description: JSON responses are never cached by the browser.
    Set-Cookie:
      schema:
        type: string
      description: Sets or clears roadmates_refresh; HttpOnly; SameSite=Lax; Path=/api/v1/auth; Secure
        according to COOKIE_SECURE; Max-Age according to REFRESH_TOKEN_TTL. Never read by JavaScript.
    Retry-After:
      schema:
        type: string
        pattern: ^[0-9]+$
      description: Whole seconds until the rate window resets.
  parameters:
    AppVersion:
      in: header
      name: X-App-Version
      required: false
      schema:
        type: string
      description: Full semantic version, for example 0.1.0. Missing is allowed; malformed is 400; outdated
        is 426.
    Client:
      in: header
      name: X-Client
      required: false
      schema:
        type: string
      description: Client identity for logs; web for the React app.
    RequestID:
      in: header
      name: X-Request-ID
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional valid correlation ID; invalid/missing values are replaced.
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly equal ALLOWED_ORIGIN, including scheme, host, and non-default port.
    CSRF:
      in: header
      name: X-Requested-With
      required: true
      schema:
        type: string
        enum:
        - roadmates
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - INVALID_INPUT
          - PASSWORD_POLICY
          - APP_VERSION_INVALID
          - APP_VERSION_UNSUPPORTED
          - UNAUTHORIZED
          - INVALID_CREDENTIALS
          - REFRESH_TOKEN_REUSED
          - FORBIDDEN
          - CSRF_INVALID
          - NOT_FOUND
          - API_VERSION_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - EMAIL_TAKEN
          - DRIVER_ALREADY_VERIFIED
          - APPLICATION_PENDING
          - APPLICATION_ALREADY_REVIEWED
          - APPLICANT_INACTIVE
          - DRIVER_HAS_ACTIVE_RIDE
          - RIDE_NOT_ACTIVE
          - RATE_LIMITED
          - INTERNAL_ERROR
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        last_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        phone:
          type: string
          minLength: 7
          maxLength: 25
          description: 7–15 digits; optional leading +, spaces, parentheses, and hyphens.
        roles:
          type: array
          items:
            type: string
            enum:
            - client
            - driver
            - admin
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - id
      - email
      - first_name
      - last_name
      - phone
      - roles
      - created_at
      - updated_at
      - is_active
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: 8 or more Unicode characters, at most 72 UTF-8 bytes. Requires uppercase, lowercase,
            and punctuation/symbol. No whitespace or control characters. bcrypt cost 12.
        first_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        last_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        phone:
          type: string
          minLength: 7
          maxLength: 25
          description: 7–15 digits; optional leading +, spaces, parentheses, and hyphens.
      required:
      - email
      - password
      - first_name
      - last_name
      - phone
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: At most 72 UTF-8 bytes.
      required:
      - email
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: HS256 JWT. Keep only in memory; refresh token is delivered exclusively in the HttpOnly
            cookie.
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - user
    DriverApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        contact_phone:
          type: string
          minLength: 7
          maxLength: 25
          description: 7–15 digits; optional leading +, spaces, parentheses, and hyphens.
        first_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        last_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed Unicode letters/marks, spaces, apostrophes or hyphens.
        pin_code:
          type: string
          minLength: 7
          maxLength: 7
          pattern: ^[A-Za-z0-9]{7}$
          writeOnly: true
          description: Trimmed, uppercased, then encrypted with AES-256-GCM. Never logged.
        car_make:
          type: string
          minLength: 1
          maxLength: 50
        car_model:
          type: string
          minLength: 1
          maxLength: 50
        car_year:
          type: integer
          minimum: 1980
          description: Maximum is the current UTC year plus one.
        car_plate:
          type: string
          minLength: 3
          maxLength: 15
          description: Letters/numbers, spaces and hyphens; trimmed and uppercased.
        car_color:
          type: string
          minLength: 1
          maxLength: 50
        seats:
          type: integer
          minimum: 1
          maximum: 8
      required:
      - contact_phone
      - first_name
      - last_name
      - pin_code
      - car_make
      - car_model
      - car_year
      - car_plate
      - car_color
      - seats
    DriverApplication:
